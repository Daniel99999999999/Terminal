; Keep esp32dev when using a generic development board carrying a WROVER module.
; Do not switch to esp-wrover-kit unless you actually have that Espressif carrier board.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_mode = qio

upload_protocol = esptool
upload_port = COM5
monitor_port = COM5

; Mutually exclusive physical pin plans. Build/upload the wired variant only.
[env:esp32dev_i80]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_ILI9341_I80

[env:esp32dev_spi]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_ILI9341_SPI

; Explicit headless build even when the user-selected header default is SPI.
[env:esp32dev_headless]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_NONE
