; ESP32-WROVER on a generic development carrier; native C / ESP-IDF.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = espidf
build_type = release
board_upload.flash_size = 4MB
board_build.flash_mode = dio
; Fresh SDK configuration, independent of historical sdkconfig.esp32dev.
board_build.esp-idf.sdkconfig_path = sdkconfig.terminal
monitor_speed = 115200
upload_protocol = esptool
upload_port = COM5
monitor_port = COM5

[env:esp32dev_spi]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_ILI9341_SPI

[env:esp32dev_i80]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_ILI9341_I80

[env:esp32dev_headless]
extends = env:esp32dev
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_NONE

; Same standard PSRAM initialization; no display/UART task is started.
[env:esp32dev_core]
extends = env:esp32dev
build_flags = -DRETRO_STARTUP_STAGE=0 -DRETRO_TFT_PROFILE=RETRO_TFT_NONE

; Explicit diagnostic alternative. Default esp32dev still enables PSRAM.
[env:esp32dev_internal]
extends = env:esp32dev
board_build.esp-idf.sdkconfig_path = sdkconfig.terminal_internal
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.internal.defaults

[env:esp32dev_touch]
extends = env:esp32dev_internal
board_build.esp-idf.sdkconfig_path = sdkconfig.terminal_touch
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.touch.defaults
build_flags = -DRETRO_TFT_PROFILE=RETRO_TFT_ILI9341_SPI -DRETRO_TOUCH_ENABLE=1
