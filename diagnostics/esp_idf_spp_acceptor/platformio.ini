[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB
upload_protocol = esptool
upload_port = COM10
monitor_port = COM10

# Original C and SDK; bypass stored RF calibration, without erasing NVS.
[env:rf_fullcal]
extends = env:esp32dev
